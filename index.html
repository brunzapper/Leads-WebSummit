<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zapper — WebSummit Rio 2026</title>
<style>
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface2: #21262D;
    --border: #30363D;
    --accent: #00C896;
    --t1: #00C896;
    --t2: #2A8BF2;
    --alto: #00C896;
    --medio: #F39C12;
    --baixo: #484F58;
    --text: #E6EDF3;
    --sub: #8B949E;
    --dim: #484F58;
    --radius: 8px;
    --header-h: 56px;
    --filter-h: 48px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; }

  /* ── Header ── */
  header {
    height: var(--header-h); display: flex; align-items: center; gap: 10px;
    padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--surface);
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  }
  .logo { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
  .logo span { color: var(--sub); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .search-wrap { flex: 1; position: relative; min-width: 0; }
  #search {
    width: 100%; padding: 8px 12px 8px 34px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 15px; outline: none;
    -webkit-appearance: none; appearance: none; transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--dim); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 15px; pointer-events: none; }

  /* ── Filter bar ── */
  .filters {
    height: var(--filter-h); display: flex; align-items: center; gap: 6px; padding: 0 16px;
    border-bottom: 1px solid var(--border); background: var(--surface);
    position: fixed; top: var(--header-h); left: 0; right: 0; z-index: 190;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 2px; }
  .pill {
    padding: 5px 11px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--sub);
    white-space: nowrap; flex-shrink: 0; transition: all .15s; -webkit-appearance: none; user-select: none;
  }
  .pill:active { opacity: .7; }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #0D1117; }
  .pill.t1.active { background: var(--t1); border-color: var(--t1); color: #0D1117; }
  .pill.t2.active { background: var(--t2); border-color: var(--t2); color: #fff; }
  .pill.toggle.active { background: rgba(0,200,150,.18); border-color: var(--accent); color: var(--accent); }

  /* ── App shell ── */
  .app-shell { position: fixed; top: calc(var(--header-h) + var(--filter-h)); left: 0; right: 0; bottom: 0; display: flex; }

  /* ── List panel ── */
  .list-panel { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
  .list-count { padding: 8px 14px; font-size: 11px; color: var(--sub); border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .list-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .company-item {
    display: flex; align-items: center; gap: 7px; padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid var(--border); border-left: 3px solid transparent;
    transition: background .1s, border-left-color .1s; user-select: none;
  }
  .company-item:active { background: var(--surface2); }
  .company-item.selected { background: var(--surface2); border-left-color: var(--accent); }

  .company-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tier-badge { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; }
  .tier-badge.t1 { background: rgba(0,200,150,.15); color: var(--t1); }
  .tier-badge.t2 { background: rgba(42,139,242,.15); color: var(--t2); }
  .tier-badge.alto { background: rgba(0,200,150,.12); color: var(--alto); }
  .tier-badge.medio { background: rgba(243,156,18,.12); color: var(--medio); }
  .tier-badge.baixo { background: rgba(72,79,88,.2); color: var(--dim); }
  .score-chip { font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
  .people-count { font-size: 11px; color: var(--dim); flex-shrink: 0; }
  .no-results-list { padding: 28px 16px; text-align: center; color: var(--dim); font-size: 13px; }

  /* ── Detail panel ── */
  .detail-panel { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; }
  .detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; color: var(--dim); text-align: center; }
  .detail-empty .icon { font-size: 40px; }
  .detail-empty p { font-size: 14px; }

  /* Company header in detail */
  .detail-company-name { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.4px; margin-bottom: 8px; }
  .detail-meta { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .meta-pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: var(--surface2); color: var(--sub); }
  .meta-pill.t1 { background: rgba(0,200,150,.12); color: var(--t1); }
  .meta-pill.t2 { background: rgba(42,139,242,.12); color: var(--t2); }
  .meta-score { color: var(--accent); font-weight: 700; }
  .meta-pill.fit-alto { background: rgba(0,200,150,.12); color: var(--alto); }
  .meta-pill.fit-medio { background: rgba(243,156,18,.12); color: var(--medio); }

  /* ── Fit reason card ── */
  .fit-card {
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
    border-left: 3px solid var(--border);
  }
  .fit-card.tier1 { background: rgba(0,200,150,.06); border-left-color: var(--t1); }
  .fit-card.tier2 { background: rgba(42,139,242,.06); border-left-color: var(--t2); }
  .fit-card.alto  { background: rgba(0,200,150,.05); border-left-color: var(--alto); }
  .fit-card.medio { background: rgba(243,156,18,.05); border-left-color: var(--medio); }
  .fit-card.baixo { background: rgba(72,79,88,.08);   border-left-color: var(--dim); }
  .fit-card-label { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--sub); margin-bottom: 5px; }
  .fit-card-category { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .fit-card-reason { font-size: 12px; color: var(--sub); line-height: 1.5; }

  /* ── People grid ── */
  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .people-section-label { font-size: 11px; font-weight: 600; color: var(--sub); letter-spacing: .4px; text-transform: uppercase; margin-bottom: 8px; }
  .person-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .person-rank { font-size: 9px; font-weight: 700; letter-spacing: .5px; color: var(--dim); text-transform: uppercase; margin-bottom: 5px; }
  .person-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; line-height: 1.3; }
  .person-title { font-size: 12px; color: var(--sub); margin-bottom: 6px; line-height: 1.4; }
  .person-type { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 3px; background: var(--surface2); color: var(--dim); }
  .person-type.alpha { background: rgba(255,170,0,.1); color: #FFAA00; }
  .person-type.beta  { background: rgba(42,139,242,.1); color: #2A8BF2; }
  .person-type.growth{ background: rgba(0,200,150,.1); color: #00C896; }

  mark { background: rgba(0,200,150,.25); color: var(--accent); border-radius: 2px; padding: 0 1px; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ════════════ MOBILE ════════════ */
  @media (max-width: 700px) {
    :root { --header-h: 52px; --filter-h: 44px; }
    header { padding: 0 12px; gap: 8px; }
    .logo span { display: none; }
    .filters { padding: 0 12px; gap: 5px; }
    .app-shell { flex-direction: column; }

    .list-panel {
      width: 100%; position: absolute; inset: 0; background: var(--bg); z-index: 10;
      transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .28s; border-right: none;
    }
    .list-panel.slide-out { transform: translateX(-100%); opacity: 0; pointer-events: none; }

    .detail-panel {
      position: absolute; inset: 0; padding: 0; background: var(--bg); z-index: 20;
      transform: translateX(100%); opacity: 0; pointer-events: none;
      transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .28s;
      display: flex; flex-direction: column;
    }
    .detail-panel.slide-in { transform: translateX(0); opacity: 1; pointer-events: all; }

    .detail-back-bar {
      display: flex; align-items: center; gap: 8px; padding: 12px 14px;
      border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    }
    .detail-back-btn {
      color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer;
      background: none; border: none; -webkit-appearance: none; padding: 4px 0;
    }
    .detail-back-label { font-size: 14px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; padding-bottom: calc(16px + var(--safe-bottom)); }

    .people-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .person-card { padding: 10px 12px; }
    .person-name { font-size: 13px; }
    .detail-company-name { font-size: 18px; }
  }
  @media (max-width: 400px) { .people-grid { grid-template-columns: 1fr; } }
  .detail-back-bar { display: none; }
</style>
</head>

// ── Hierarchy ─────────────────────────────────────────────────────────────────
function rank(t) {
  if (!t) return 99; t = t.toLowerCase();
  if (/ceo|co-ceo|co.?founder|cofound|fundador|fundadora|sócio|socio|co founder/.test(t)) return 1;
  if (/\bcto\b|\bcoo\b|\bcmo\b|\bcio\b|\bcpo\b|\bcgo\b|\bcro\b|\bclo\b|\bcfo\b/.test(t)) return 2;
  if (/vice|vp |^vp$|president/.test(t)) return 3;
  if (/diretor|diretora|director/.test(t)) return 4;
  if (/partner/.test(t) && !/partnership/.test(t)) return 5;
  if (/head/.test(t)) return 6;
  if (/gerente|manager|lead|gestor|coord|superintendent/.test(t)) return 7;
  if (/especialista|specialist|senior|sr\.|business dev|compliance|consult/.test(t)) return 8;
  if (/analista|analyst|developer|engineer|designer/.test(t)) return 9;
  return 10;
}
function sortPeople(p) { return [...p].sort((a,b) => { const d=rank(a.t)-rank(b.t); return d||( a.n||'').localeCompare(b.n||'','pt-BR'); }); }
function rankLabel(t) { return ['','C-Suite/Founder','C-Suite','VP','Diretor','Partner','Head','Gestão','Especialista','Analista/Dev',''][rank(t)]||''; }

// ── State ─────────────────────────────────────────────────────────────────────
let query='', stageFilter='all', filterBrasil=true, filterComPessoas=true, selected=null, filtered=[];
const isMobile = () => window.innerWidth <= 700;

// ── Utils ─────────────────────────────────────────────────────────────────────
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function hi(text, q) {
  if (!q) return esc(text);
  const n=norm(text),nq=norm(q),i=n.indexOf(nq);
  if (i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

function fitOf(c) {
  if (c.tier==='Tier 1') return 'T1';
  if (c.tier==='Tier 2') return 'T2';
  return c.fit||'';
}

function matches(c, q, sf, brasil, comPessoas) {
  if (brasil && c.country && c.country!=='Brasil' && c.country!=='Brazil') return false;
  if (comPessoas && c.p.length===0) return false;
  if (sf==='Tier 1' && c.tier!=='Tier 1') return false;
  if (sf==='Tier 2' && c.tier!=='Tier 2') return false;
  if (sf==='alto' && fitOf(c)!=='T1' && fitOf(c)!=='T2' && c.fit!=='alto') return false;
  if (sf==='medio' && c.fit!=='médio') return false;
  if (sf==='Growth' && c.stage!=='GROWTH' && c.stage!=='Growth') return false;
  if (sf==='Beta' && c.stage!=='BETA' && c.stage!=='Beta') return false;
  if (sf==='Alpha' && c.stage!=='ALPHA' && c.stage!=='Alpha') return false;
  if (!q) return true;
  const nq=norm(q);
  if (norm(c.c).includes(nq)) return true;
  if (c.sector && norm(c.sector).includes(nq)) return true;
  if (c.category && norm(c.category).includes(nq)) return true;
  for (const p of c.p) { if (norm(p.n).includes(nq)||norm(p.t).includes(nq)) return true; }
  return false;
}

// ── Render list ───────────────────────────────────────────────────────────────
function renderList() {
  filtered = RAW.filter(c => matches(c, query, stageFilter, filterBrasil, filterComPessoas));
  document.getElementById('list-count').textContent = filtered.length + ' empresa' + (filtered.length!==1?'s':'');
  const body = document.getElementById('list-body');
  if (!filtered.length) { body.innerHTML='<div class="no-results-list">Nenhuma empresa encontrada</div>'; renderDetail(null); return; }

  body.innerHTML = filtered.map((c, i) => {
    const sel = selected && selected.c===c.c;
    const f = fitOf(c);
    let badgeClass='', badgeLabel='';
    if (c.tier==='Tier 1') { badgeClass='t1'; badgeLabel='T1'; }
    else if (c.tier==='Tier 2') { badgeClass='t2'; badgeLabel='T2'; }
    else if (c.fit==='alto') { badgeClass='alto'; badgeLabel='Alto fit'; }
    else if (c.fit==='médio') { badgeClass='medio'; badgeLabel='Médio'; }
    else if (c.fit==='baixo') { badgeClass='baixo'; badgeLabel='Baixo'; }
    return `<div class="company-item${sel?' selected':''}" data-idx="${i}" role="button" tabindex="0">
      <div class="company-name">${hi(c.c, query)}</div>
      ${badgeLabel?`<span class="tier-badge ${badgeClass}">${badgeLabel}</span>`:''}
      ${c.score?`<span class="score-chip">${c.score}</span>`:''}
      <span class="people-count">${c.p.length}p</span>
    </div>`;
  }).join('');

  if (selected && !filtered.find(c=>c.c===selected.c)) { selected=null; renderDetail(null); }
  if (!selected && filtered.length) { selectCompany(filtered[0], false); }
}

// ── Select & detail ───────────────────────────────────────────────────────────
function selectCompany(company, slide=true) {
  selected = company;
  renderDetail(company);
  document.querySelectorAll('.company-item').forEach((el,_) =>
    el.classList.toggle('selected', el.dataset.idx===String(filtered.indexOf(company))));
  if (isMobile() && slide) {
    document.getElementById('list-panel').classList.add('slide-out');
    document.getElementById('detail-panel').classList.add('slide-in');
    document.getElementById('back-label').textContent = company.c;
    // Push a history entry so the device back button returns to the list
    if (!history.state || !history.state.detail) {
      history.pushState({ detail: true }, '');
    }
  }
}
function goBack() {
  document.getElementById('list-panel').classList.remove('slide-out');
  document.getElementById('detail-panel').classList.remove('slide-in');
}

// Intercept the device / browser back button on mobile
window.addEventListener('popstate', e => {
  if (isMobile()) {
    const panel = document.getElementById('detail-panel');
    if (panel.classList.contains('slide-in')) {
      goBack();
      // Re-push so successive back presses still work before truly leaving
      // (no re-push here — we want a clean stack after dismissal)
    }
  }
});

function renderDetail(company) {
  const content = document.getElementById('detail-content');
  document.getElementById('back-label').textContent = company ? company.c : '';
  if (!company) {
    content.innerHTML = '<div class="detail-empty"><div class="icon">🔍</div><p>Selecione uma empresa</p></div>';
    return;
  }

  const people = sortPeople(company.p);
  const f = fitOf(company);

  // Meta pills row
  const tc = company.tier==='Tier 1'?'t1': company.tier==='Tier 2'?'t2':'';
  const fitClass = f==='T1'?'t1': f==='T2'?'t2': f==='alto'?'fit-alto': f==='médio'?'fit-medio':'';
  const fitLabel = f==='T1'?'Tier 1': f==='T2'?'Tier 2': f==='alto'?'Alto fit': f==='médio'?'Fit médio': f==='baixo'?'Baixo fit':'';
  const pills = [
    fitLabel ? `<span class="meta-pill ${fitClass}">${fitLabel}</span>` : '',
    company.stage ? `<span class="meta-pill">${esc(company.stage)}</span>` : '',
    company.sector ? `<span class="meta-pill">${esc(company.sector)}</span>` : '',
    (company.category && !company.tier) ? `<span class="meta-pill">${esc(company.category)}</span>` : '',
    company.score ? `<span class="meta-pill meta-score">Score ${company.score}</span>` : '',
  ].filter(Boolean).join('');

  // Fit reason card
  let fitCardHtml = '';
  const cardClass = f==='T1'?'tier1': f==='T2'?'tier2': f==='alto'?'alto': f==='médio'?'medio':'baixo';
  const cardLabel = f==='T1'?'Por que é Tier 1': f==='T2'?'Por que é Tier 2':
                    f==='alto'?'Por que alto fit': f==='médio'?'Por que fit médio':
                    f==='baixo'?'Por que baixo fit':'Análise de fit';
  if (company.reason) {
    fitCardHtml = `<div class="fit-card ${cardClass}">
      <div class="fit-card-label">${cardLabel}</div>
      ${company.category && !company.tier ? `<div class="fit-card-category">${esc(company.category)}</div>` : ''}
      <div class="fit-card-reason">${esc(company.reason)}</div>
    </div>`;
  }

  // People section
  const peopleSectionLabel = people.length
    ? `<div class="people-section-label">${people.length} pessoa${people.length!==1?'s':''} no evento</div>`
    : '';
  const cards = people.map(person => {
    const ptl = (person.pt||'').toLowerCase();
    const ptc = ptl==='alpha'?'alpha': ptl==='beta'?'beta': ptl==='growth'?'growth':'';
    const rl = rankLabel(person.t);
    return `<div class="person-card">
      ${rl?`<div class="person-rank">${esc(rl)}</div>`:''}
      <div class="person-name">${hi(person.n, query)}</div>
      <div class="person-title">${hi(person.t||'—', query)}</div>
      ${person.pt?`<span class="person-type ${ptc}">${esc(person.pt)}</span>`:''}
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="detail-company-name">${hi(company.c, query)}</div>
    <div class="detail-meta">${pills}</div>
    ${fitCardHtml}
    ${peopleSectionLabel}
    <div class="people-grid">${cards||'<div class="no-results-list">Nenhuma pessoa mapeada.</div>'}</div>`;
}

// ── Events ────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim(); selected = null;
  if (isMobile()) goBack();
  renderList();
});

document.getElementById('list-body').addEventListener('click', e => {
  const item = e.target.closest('.company-item');
  if (item) selectCompany(filtered[parseInt(item.dataset.idx)]);
});
document.getElementById('list-body').addEventListener('keydown', e => {
  if (e.key==='Enter') { const item=e.target.closest('.company-item'); if(item) selectCompany(filtered[parseInt(item.dataset.idx)]); }
});
document.getElementById('back-btn').addEventListener('click', goBack);

document.querySelectorAll('.pill.toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('active');
    if (btn.dataset.toggle==='brasil') filterBrasil = btn.classList.contains('active');
    if (btn.dataset.toggle==='com-pessoas') filterComPessoas = btn.classList.contains('active');
    selected = null; if (isMobile()) goBack(); renderList();
  });
});

document.querySelectorAll('.pill[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    stageFilter = btn.dataset.filter;
    document.querySelectorAll('.pill[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selected = null; if (isMobile()) goBack(); renderList();
  });
});

document.getElementById('search').addEventListener('keydown', e => {
  if (!['ArrowDown','ArrowUp','Enter'].includes(e.key)) return;
  e.preventDefault();
  const items = document.querySelectorAll('.company-item');
  if (!items.length) return;
  const cur = [...items].findIndex(el => el.classList.contains('selected'));
  let next = cur;
  if (e.key==='ArrowDown') next = Math.min(cur+1, items.length-1);
  if (e.key==='ArrowUp') next = Math.max(cur-1, 0);
  if (next!==cur || e.key==='Enter') { items[next]?.click(); items[next]?.scrollIntoView({block:'nearest'}); }
});

document.getElementById('list-body').addEventListener('click', () => { document.getElementById('detail-content').scrollTop = 0; });
window.addEventListener('resize', () => {
  if (!isMobile()) { document.getElementById('list-panel').classList.remove('slide-out'); document.getElementById('detail-panel').classList.remove('slide-in'); }
});

renderList();
</script>
</body>
</html>
